<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meu Portfólio</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Cabeçalho Preto -->
    <div class="cabecalho">
        <a href="https://www.linkedin.com" target="_blank">
            <i class="fa-brands fa-linkedin"></i>
        </a>
        <div class="box-telefone">
            <i class="fa-solid fa-phone"></i>
            <br>
            <span>(11) 99999-9999</span>
        </div>
    </div>

    <!-- Conteúdo da Página -->
    <div class="conteudo">
        
        <!-- Lado Esquerdo (Foto e Nome) -->
        <div class="lado-esquerdo">
            <img src="foto.jpg" alt="Minha Foto">
            <h2>Miguel Brito</h2>
        </div>

        <!-- Lado Direito (Corpo do Portfólio - 75%) -->
        <div class="lado-direito">
            <h2>Sobre Mim</h2>
            <p>Olá! Sou estudante de desenvolvimento de software e este é o meu primeiro portfólio.</p>
            
            <h2>Meus Projetos</h2>
            <p>Em breve adicionarei meus projetos aqui.</p>
        </div>

    </div>

</body>
</html>
